name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment configured in the nuget.org Trusted Publishing policy.
    environment: nuget-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Validate tag, version and changelog
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dotnet msbuild src/Pinotechrd.Security/Pinotechrd.Security.csproj -getProperty:Version)
          echo "Directory.Build.props version: ${version}"

          if [[ "${TAG}" != "v${version}" ]]; then
            echo "::error::Tag ${TAG} does not match version v${version} in Directory.Build.props."
            exit 1
          fi

          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section."
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tagged commit ${GITHUB_SHA} is not on main."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Pinotechrd.Security.slnx

      - name: Audit vulnerable packages
        shell: pwsh
        run: ./build/audit-vulnerable-packages.ps1 -ReportPath "${{ runner.temp }}/audit/nuget-vulnerability-report.json"

      - name: Build (warnings are errors)
        run: dotnet build Pinotechrd.Security.slnx --configuration Release --no-restore -warnaserror

      - name: Test with coverage gate
        run: >-
          dotnet test tests/Pinotechrd.Security.Tests/Pinotechrd.Security.Tests.csproj
          --configuration Release --no-build --verbosity minimal
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
          '/p:Include=[Pinotechrd.Security]Pinotechrd.Security.*'
          /p:Threshold=40 /p:ThresholdType=line /p:ThresholdStat=total

      - name: Pack
        run: |
          dotnet pack src/Pinotechrd.Security.Abstractions/Pinotechrd.Security.Abstractions.csproj --configuration Release --no-build --output "${{ runner.temp }}/packages"
          dotnet pack src/Pinotechrd.Security/Pinotechrd.Security.csproj --configuration Release --no-build --output "${{ runner.temp }}/packages"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg

      # Requested right before the push: the temporary API key is valid for one hour.
      - name: NuGet login (OIDC → temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Abstractions first so the main package's dependency already exists; the .snupkg next to each .nupkg is pushed with it.
      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_TEMP_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PKG_DIR: ${{ runner.temp }}/packages
        run: |
          for pkg in "${PKG_DIR}"/Pinotechrd.Security.Abstractions.*.nupkg "${PKG_DIR}"/Pinotechrd.Security.[0-9]*.nupkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_TEMP_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
